<div class="mb-3 {{ cls }}">
  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if not field.field.required and not force_required %} <span class="text-muted fw-normal">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="text-danger small mt-1"><i class="bi bi-exclamation-circle"></i> {{ e }}</div>{% endfor %}
</div>
